# Traffic Light Module Settings

file_version: 1
# Visual representation in menus
menus:
  vote:
    item: ROSE_BUSH

# Game items (optional)
items:
  # Items to give players on game start
  # Format: MATERIAL:AMOUNT:SLOT
  starting_items: []
  # Example:
  # - "COOKED_BEEF:16:0"
  # - "GOLDEN_APPLE:3:8"

# Potion effects (optional)
effects:
  # Effects to give players during the game
  # Format: EFFECT_TYPE:DURATION_TICKS:AMPLIFIER
  starting_effects: []
  # Example:
  # - "SPEED:999999:1"
  # - "JUMP_BOOST:999999:0"

  # Effects when player respawns
  # Format: EFFECT_TYPE:DURATION_TICKS:AMPLIFIER
  respawn_effects:
    - "DAMAGE_RESISTANCE:60:2"  # 3 seconds of resistance after respawn

# Traffic light behavior
red_light:
  durations:
    green:
      min: 3
      max: 6
    yellow:
      min: 1
      max: 3
    red:
      min: 1
      max: 8
  pushback:
    # When true, the first red-light movement pushes the player back instead of eliminating immediately.
    enabled: true
    # Horizontal force applied to the pushback velocity.
    force: 1.15
    # Ticks before a second red-light movement triggers elimination after a pushback.
    immunity_ticks: 15
